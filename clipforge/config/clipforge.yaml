# ClipForge configuration — packaged defaults.
#
# §17 is emphatic: every tunable value lives in a config file, never hardcoded.
# All fourteen rows of that table appear below. Values are educated guesses, not
# validated numbers (C5) — they exist to be tuned against real footage.
#
# LAYERING (lowest priority first):
#   1. this file
#   2. clipforge/config/local.yaml   (gitignored — machine-specific paths)
#   3. --config FILE  or  $CLIPFORGE_CONFIG
#   4. command-line flags
#
# PATHS: a relative path resolves against the *project root* (the directory
# holding pyproject.toml), not the current working directory, so commands behave
# the same from anywhere in the tree. `clipforge config show` prints the
# resolved absolute paths.

# 2 (commit 37): score.profile (one name) became score.profiles (a LIST),
# because §6.5 runs entertainment AND gameplay plus the combined score. A
# local.yaml still setting the old key is refused BY NAME in config.py -- this
# version number cannot catch it on its own, since a local.yaml inherits the
# value from this file unless it pins the key itself.
config_schema: 2

paths:
  data_root: ./data
  # null -> $CLIPFORGE_FFMPEG, then PATH. Set these in local.yaml on a machine
  # where ffmpeg is not installed globally.
  ffmpeg: null
  ffprobe: null
  # null -> <data_root>/clipforge.db
  db: null

ingest:
  stream_id_slug_max_len: 40

  probe:
    # Seconds of presentation timestamps sampled to decide constant vs variable
    # frame rate. The classifier fits PTS against a constant rate and checks the
    # residual, because neither frame durations nor PTS deltas can tell the two
    # apart: an MKV on a 1 ms timebase stores CFR 30 fps as alternating 33/34 ms
    # frames, and ffprobe's duration_time field reports a nominal value that
    # cannot detect real VFR at all. Two windows are sampled -- the start, and
    # mid-file, since a recording can begin CFR and degrade once the encoder is
    # under load. Longer is more evidence and more probe time.
    rate_sample_seconds: 4.0

  # §5.2. The proxy exists for scrubbing speed, not storage (§13.1).
  proxy:
    height: 720
    video_bitrate: 2M
    preset: veryfast
    audio_bitrate: 128k

    # §5.2 specifies libx264, i.e. CPU encoding. MEASURED on the build machine,
    # same file (682 s of 720p60), same bitrate and GOP settings:
    #
    #   libx264 veryfast   333.0 s   2.0x realtime   175 MB
    #   h264_qsv           139.5 s   4.9x realtime   181 MB
    #
    # Both produced keyframes exactly every 30 frames, so A2 holds either way.
    # 2.4x from a weak integrated GPU; a discrete NVENC card is several times
    # faster again. Extrapolated to a 4-hour stream that is ~2.0 h of CPU
    # encoding versus ~49 min here and well under that on real hardware,
    # against §1.3's 20-40 minute budget for ALL unattended processing -- a
    # budget Phase 2's WhisperX also draws on. A faster CPU halves the first
    # number and still misses.
    #
    # `auto` resolves at run time by actually test-encoding a fraction of a
    # second with each candidate, in preference order, and taking the first
    # that works. Listing an encoder is not detection: this build ships
    # h264_nvenc and it fails with "Cannot load nvcuda.dll" on a machine with
    # no NVIDIA driver.
    #
    # Set a specific codec name to pin it. `libx264` is always the fallback.
    video_codec: auto
    codec_preference: [h264_nvenc, h264_qsv, h264_amf, libx264]

    # Per-encoder settings, because one flat block cannot serve both. NVENC has
    # no scenecut threshold, uses p1-p7 rather than x264's preset names, and
    # needs its own rate control.
    #
    # Fixed GOP is what A2 requires and what makes seeking instant, so each
    # entry must produce it. If one of these is wrong, the proxy stage's
    # post-encode keyframe check fails loudly rather than silently shipping a
    # proxy that scrubs badly -- which is what makes it safe to ship encoder
    # settings that could not be tested on the build machine.
    codecs:
      libx264:
        preset: veryfast
        args: ["-sc_threshold", "0"]
      h264_nvenc:
        preset: p4
        # -no-scenecut is the NVENC equivalent of x264's scenecut=0; -rc vbr
        # with -b:v gives the same bitrate target as libx264's ABR mode.
        args: ["-no-scenecut", "1", "-rc", "vbr", "-tune", "hq"]
      h264_qsv:
        preset: medium
        args: []
      h264_amf:
        preset: balanced
        args: ["-rc", "vbr_peak"]

    extra_output_args: []
    # A2: fixed GOP. Without sc_threshold=0, x264 inserts keyframes on scene
    # changes and seek granularity becomes unpredictable. gop=30 is 0.5 s at
    # 60 fps, 1 s at 30 fps.
    #
    # Verified against ffmpeg 9: libx264 still exposes a private sc_threshold
    # (default -1) that maps to x264's scenecut, so §5.2's flag does what it
    # says. It was a plausible casualty of deprecation, which would have voided
    # A2 silently -- hence the keyframe check after every encode.
    gop: 30
    keyint_min: 30
    sc_threshold: 0
    # NOT IN THE SPEC. §5.2 claims the proxy shares the master's timebase, which
    # is false for a VFR master, and its command has no -fps_mode. Forcing CFR
    # is what actually makes that claim true and keeps review timestamps and
    # export timestamps interchangeable.
    force_cfr: true
    # NOT IN §5.2 either. A 10-bit or 4:2:2 master -- some capture cards, and
    # OBS with certain encoder settings -- produces a proxy no browser can
    # decode, so the review UI shows a black player and no error at all.
    pix_fmt: yuv420p

    # Checked immediately after encoding, inside the stage, so a proxy that
    # does not match its master never becomes a completed artifact.
    verify:
      # Hard failure: every timestamp in the system assumes proxy and master
      # are interchangeable (§5.2, §13.1).
      max_duration_delta_s: 0.5
      # Hard for CFR masters, advisory for VFR ones -- forcing CFR legitimately
      # changes the frame count there.
      max_frame_delta: 2
      # A2's fixed GOP is the whole reason Phase 1 live-seeks the proxy instead
      # of pre-rendering previews (§7.2). Sample this many seconds of keyframes
      # and require the spacing to hold; 0 disables the check.
      keyframe_sample_s: 60.0
      max_keyframe_interval_ratio: 1.5

  # §5.3. 16 kHz mono is correct for WhisperX and every audio feature. Do not
  # raise it.
  #
  # STORAGE, which §13.1's table has no row for: 16 kHz mono s16le is ~115 MB
  # per hour per track, so mic+game+party over a 4-hour stream is ~1.4 GB and
  # ~140 GB across 100 streams -- comparable to the previews and metadata tiers
  # combined. Regenerable from the master, so safe to delete, but Phase 2's
  # WhisperX consumes them.
  audio:
    sample_rate_hz: 16000
    channels: 1
    codec: pcm_s16le
    # §5.3 maps a:1/2/3 and deliberately not a:0 -- the proxy already carries
    # the mix for review, so extracting it would add ~460 MB per stream for
    # something nothing analyses. Roles absent from the probed track map are
    # skipped, so a single-track file yields only mic.wav.
    extract_roles: [mic, game, party]
    verify:
      # A truncated extraction is silent corruption: it shows up much later as
      # candidates that stop appearing partway through a stream.
      max_duration_delta_s: 0.5
      # Sampled from a few blocks rather than by reading the file; a 4-hour
      # mono WAV is ~230 MB and the header already gives the frame count.
      silence_probe_blocks: 12
      # Peak below this counts as digital silence. A silent mic.wav means the
      # track mapping is wrong; a silent party.wav just means nobody was in
      # Discord -- so this warns and never fails.
      silence_peak_dbfs: -80.0
    # role -> ffmpeg audio stream index (§4.2's track layout).
    # null = infer from probe. A single-track file maps to `mic` and warns:
    # mic RMS is then contaminated by game audio, which §4.2 calls
    # unrecoverable after the fact.
    track_roles:
      mic: null
      game: null
      party: null

extract:
  # §5.4: all continuous signals are computed at 10 Hz and stored at 10 Hz.
  #
  # This is the ONLY place the hop is defined. There was briefly a separate
  # extract.rms.hop_s alongside it, which is one fact stated twice: set one
  # without the other and the series' declared sample rate stops matching its
  # actual spacing, silently shifting every timestamp derived from it. §5.4
  # says "10 Hz (100 ms hop)" -- the same fact, not two.
  signal_hz: 10.0

  # §5.7. Phase 2. Defaults are the spec's, which are right for the streaming PC
  # and impossible on a machine with no NVIDIA GPU -- see local.yaml.example for
  # the CPU block.
  whisperx:
    # OFF by default, and that is not timidity. §15 puts the transcript in
    # Phase 2 and is emphatic about shipping Phase 1 first; until
    # speaker_assign, speech_rate and phrase_detect exist, a transcript feeds
    # nothing. Leaving it on would mean every `clipforge run` pulls a 3 GB model
    # and, on a machine without a GPU, spends hours producing rows that nothing
    # reads. Turn it on when the rest of Phase 2 lands, or to experiment.
    #
    # When off, the stage reports as deferred and the run continues to `score`.
    enabled: false

    model: large-v3
    device: cuda

    # NOT IN §5.7, which hardcodes float16 because it assumes CUDA. CTranslate2
    # REJECTS float16 on CPU outright, so the spec's literal value fails with an
    # error naming neither the setting nor the cause. `auto` resolves per device;
    # an explicit value still wins.
    compute_type: auto

    # NOT IN §5.7 either, which sets no language and so detects one per chunk.
    # A chunk of near-silence or game noise is exactly where Whisper decides the
    # language is Welsh and hallucinates to match. null = auto-detect.
    language: en

    # §5.8: run separately on the mic and party tracks, then merge. The game
    # track is deliberately absent -- it is game audio, and transcribing it
    # produces confident nonsense that would then be scored and shown. A
    # single-track recording transcribes just mic.
    roles: [mic, party]

    batch_size: 16

    # A4: "VAD filtering must be enabled. Without it, Whisper hallucinates
    # phantom text over silence and music."
    #
    # silero rather than pyannote: whisperx's pyannote path fetches
    # pyannote/segmentation-3.0, which needs a HuggingFace account and licence
    # acceptance -- contradicting §5.8's own reason for avoiding pyannote ("no
    # Hugging Face token, no license acceptance, and no model"). MEASURED on the
    # build machine: pyannote's audio IO also fails here outright, because
    # torchcodec cannot load against torch 2.8+cpu.
    vad_method: silero
    vad_options:
      # §5.7's values. VERIFIED they apply to both methods in whisperx 3.8;
      # chunk_size is required by silero, whose binarization happens before the
      # chunks are merged.
      chunk_size: 30
      vad_onset: 0.5
      vad_offset: 0.363

    # §5.7: "run whisperx.align() for word-level timestamps. These drive
    # captions, cut-point snapping, and speech-rate calculation." Downloads a
    # wav2vec2 model (~360 MB) on first use. Turning this off leaves segments
    # with no words, which disables §6.3's boundary snapping.
    align: true

    # §5.7's vocabulary seeding. Resolved against this directory. A sibling
    # `vocabulary.local.txt` is merged when present and is gitignored -- §5.7
    # says to include "the girlfriend's name and any recurring nicknames", and
    # names of real people should not need a commit.
    vocabulary_file: vocabulary.txt

    # hotwords | prompt | both | none.
    #
    # §5.7 passes BOTH an initial_prompt and a hotwords list, and MEASURED that
    # is a trap. They are not exclusive -- faster-whisper's get_prompt
    # concatenates hotwords then the prompt into one sot_prev section -- but it
    # truncates each to `max_length // 2 - 1` = 223 tokens, and Whisper only has
    # positional encodings for 448. Framing tokens push the total to 451, so
    # seeding both at any real length fails with
    #   RuntimeError: No position encodings are defined for positions >= 448
    # raised from inside CTranslate2, with nothing pointing at the vocabulary.
    #
    # `hotwords` alone is also the more targeted mechanism: it is a term list,
    # where initial_prompt is meant to be a style-setting sentence. `both` still
    # works, with the term list trimmed to half the budget.
    vocabulary_mode: hotwords
    # Upper bound before the token budget trims further. Both limits exist: this
    # one keeps the file sane, the token budget keeps Whisper alive.
    max_vocabulary_terms: 160

  # §5.10. Per-segment vectors, served by a local Ollama.
  #
  # Nothing reads these yet -- §11.6's search and §11.1's clustering are Phase 6.
  # They are written anyway because §11.1 says "build the logging now (it cannot
  # be reconstructed)". Enabled by default and cheap; the stage DEFERS when
  # Ollama is not running, so it never costs a pipeline run.
  embeddings:
    enabled: true
    host: http://127.0.0.1:11434

    # DEVIATION from §5.10, which recommends `bge-small-en-v1.5` (384-dim).
    # Ollama's library does not ship that model under that name. This is §5.10's
    # own second choice: 768-dim, so ~600 MB per 100 streams instead of 300 MB,
    # which is still trivial beside a 4 GB proxy.
    #
    # CHANGING THIS INVALIDATES EVERY EXISTING EMBEDDING. Two models' vectors
    # occupy unrelated spaces, and a cosine between them is finite, ordered and
    # meaningless -- so segment_embeddings records the model per row and a search
    # must filter by it rather than compare across.
    model: nomic-embed-text

    # NOT IN §5.10, and easy to miss: nomic models are trained with task
    # prefixes. Indexed text gets this one; a QUERY gets "search_query: ", which
    # extract/embeddings.py holds as QUERY_PREFIX for §11.6's search to use.
    # Omitting them puts documents and queries in slightly different regions and
    # degrades retrieval WITHOUT ERRORING.
    document_prefix: "search_document: "

    # §5.10's "~50 ms over 200k vectors" is one matmul, which holds only over
    # unit vectors. Normalising at query time instead allocates a second 600 MB
    # array per search. Measured: Ollama's /api/embed already returns unit
    # vectors for this model, so this is usually a no-op -- but the legacy
    # endpoint and other models make no such promise.
    normalise: true

    # One HTTP round trip per segment would be minutes of latency for
    # milliseconds of compute on a 2000-segment stream.
    batch_size: 32
    timeout_s: 120.0

  # §5.6 / §5.4.1. Everything derived from the transcript's words.
  phrases:
    # Resolved against clipforge/config/ when relative.
    file: phrases.yaml

    # §5.4.1: "words/sec in 3 s sliding window. Detects both excitement and dead
    # air." Shorter is twitchier; longer smooths over the pause before a
    # punchline, which is exactly what §8.7 says a model cannot hear anyway.
    speech_rate_window_s: 3.0

    # §5.6: "profanity count per 10 s window as a continuous signal."
    swear_window_s: 10.0

    repeat:
      # §5.4.2: "Same phrase >=3x in 90 s window -- bit formation in real time."
      window_s: 90.0
      min_occurrences: 3
      # N-gram length to consider. §11.2 uses 2-6 grams for the same job across
      # streams; this is the within-stream half of it.
      min_words: 2
      max_words: 6

  # §5.8. Speaker identity is which track has energy -- no model, no HF token.
  speaker:
    # NOT IN §17's table, though it belongs there: this one number decides every
    # speaker label, and therefore every caption colour in §8.3.
    #
    # It is a ratio of LINEAR POWERS, not of the stored dB. §5.8's pseudocode
    # compares dB values directly, which is why extract/speakers.py converts
    # first -- see its docstring for the measurement.
    #
    # Higher = more segments land in `both`. Tune against: whether two-person
    # crosstalk is being attributed to one person.
    dominance_ratio: 1.5

  # §5.4.1's mic_f0 / party_f0: "librosa.pyin, fmin=65, fmax=400. A pitch spike
  # outperforms a volume spike as an excitement marker."
  #
  # MEASURED on the speech fixture (95 s, both tracks, best of three after a
  # numba warm-up), extrapolated to a 4-hour stream. Two findings that decide
  # every number below, neither of them in the spec:
  #
  # 1. §5.4.1's own hop CANNOT BE USED. pyin's HMM builds a transition window of
  #    `round(35.92 * 12 * hop/sr) * bins_per_semitone + 1` states and requires
  #    it to fit inside the pitch grid (315 states over 65-400 Hz). At the 100 ms
  #    hop the rest of §5.4 uses, that window is 431 > 315 and librosa RAISES.
  #    Even where it does not raise, a window that wide spans the entire pitch
  #    range, so the Viterbi smoothing that distinguishes pyin from plain yin is
  #    doing nothing. Pitch is therefore tracked at `analysis_hop_s` and
  #    AGGREGATED to `extract.signal_hz` -- which is better anyway, since one
  #    sample per 100 ms throws away the motion within a syllable.
  #
  # 2. A LONGER HOP IS NOT SIMPLY CHEAPER AND COARSER; past a point it is wrong.
  #    At 50 ms the party track's median f0 collapsed from 222 Hz to 81 Hz and
  #    41% of frames over authored SILENCE were given a pitch -- octave-halving
  #    plus invention, in the cheapest configuration measured. 20 ms was both the
  #    most accurate and the most conservative.
  #
  #     hop     mic hit  mic false  party hit  party false   4 h, both tracks
  #     10 ms     76.4%       6.3%      76.6%        0.0%        ~29 min
  #     20 ms     79.1%       0.2%      77.7%        0.0%        ~16 min
  #     25 ms     71.5%       0.2%      77.8%        0.0%        ~14 min
  #     50 ms     59.3%       0.9%      61.7%       41.0%         ~7 min
  #
  #    ("hit" = share of authored-speech frames given a pitch; "false" = share of
  #    authored-silence frames given one. Both read from the fixture manifest.
  #    ~79% is not a shortfall: unvoiced consonants genuinely have no pitch.)
  f0:
    enabled: true

    # §5.4.1's roles. `game` is absent and must stay absent -- game audio has no
    # voice, and a pitch track of an explosion is a number with no referent.
    #
    # COST: roughly half the total above per role. NO §6.5 PROFILE WEIGHTS
    # party_f0 (or mic_f0 -- both exist to feed mic_f0_variance and any future
    # prosody work), so dropping `party` here halves the stage and loses nothing
    # any current weight reads. It stays on by default because C6 says to log
    # from day one and because recomputing it later needs the master, which
    # §13.1 does not promise to keep forever.
    roles: [mic, party]

    # §5.4.1 states both. 400 Hz is low for an excited shout; if f0 is seen
    # pinned at fmax during peaks, this is the number that is wrong.
    fmin_hz: 65.0
    fmax_hz: 400.0

    # Audio is decimated to this before tracking. fmax is 400 Hz so 8 kHz is
    # generous, and MEASURED it is not merely faster: decimating removed the
    # high-frequency content that was producing spurious pitch, taking the mic
    # track's false-positive rate from 5.0% to 0.2%.
    analysis_rate_hz: 8000

    # MUST DIVIDE 1/extract.signal_hz exactly, or each 100 ms bucket aggregates a
    # different number of frames and the series' timestamps drift against its own
    # declared sample rate. 20 ms = 5 frames per bucket.
    analysis_hop_s: 0.02
    # 128 ms. YIN's floor is two periods of fmin (31 ms); MEASURED that a 64 ms
    # frame combined with a long hop produces octave errors (median f0 falling to
    # 83 Hz) while costing the same.
    analysis_frame_s: 0.128
    # Pitch-bin width in semitones. Drives the Viterbi's cost directly, and
    # MEASURED that coarsening it is a false economy: 0.2 took the mic hit rate
    # from 79.1% to 44.5% and 0.5 took it to 12.9%. librosa's default.
    resolution: 0.1

    # pyin allocates an observation matrix of (2 x 315 x n_frames) float64 --
    # 3.6 GB for a 4-hour stream at a 20 ms hop, which is a MemoryError rather
    # than a slow stage. Audio is tracked in chunks of this length, with
    # `overlap_s` of context read either side and discarded, so the Viterbi never
    # restarts at a boundary a kept frame can see. Also what makes the stage
    # heartbeat: a 16-minute stage that never reports looks crashed to
    # `reclaim_crashed`.
    chunk_s: 300.0
    overlap_s: 2.0

  # §5.5's laughter detection: "Whisper transcribes laughter poorly, but the
  # acoustic signature is distinctive: rapid periodic bursts, 4-7 Hz envelope
  # modulation. Band-pass the RMS envelope at 4-7 Hz, threshold the energy.
  # Cheap, no model, works surprisingly well."
  #
  # THIS SIGNAL COMPUTES ITS OWN ENVELOPE, and that is not an optimisation.
  # §5.4 stores every continuous signal at 10 Hz, whose Nyquist is 5 Hz -- below
  # this band's own top edge. Two things go wrong there: content at 5-7 Hz has
  # already ALIASED down to 5-3 Hz by the time it is sampled at 10 Hz, and
  # scipy cannot even design the filter ("critical frequencies must be
  # 0 < Wn < 1"). Reusing mic_rms would have produced a number that looks like a
  # laughter score and is an artefact, with nothing downstream able to tell.
  #
  # MEASURED, at equal level, on synthetic amplitude modulation:
  #
  #   modulation        band share
  #   4.5 / 5.5 / 6.5 Hz  0.92-0.99   (in band)
  #   1 / 2 / 9 / 12 Hz   0.03        (out of band)
  #   none (noise)        0.33
  #   TTS speech          0.31 mean, 0.62 max
  #
  # Speech sits with unmodulated noise rather than with laughter, which is the
  # result this heuristic needed: a syllable rate of 4-6 Hz IS inside the band,
  # but speech spreads its envelope fluctuation across the spectrum instead of
  # concentrating it, and the score is a SHARE.
  laughter:
    enabled: true

    # §5.5: "run independently on the mic track and the party track. Party
    # laughter is the more valuable of the two because it is external
    # validation." No game entry -- §5.5 names neither, and a laugh track is not
    # what an explosion is.
    roles: [mic, party]

    # §17's `laughter_band_hz`, moved here from `deferred:` now that something
    # reads it.
    band_hz: [4.0, 7.0]

    # The envelope's own sample rate. Must be a whole multiple of
    # extract.signal_hz (so buckets aggregate evenly) and must clear twice
    # band_hz[1] with room to spare. 100 Hz is 10 samples per stored sample.
    envelope_hz: 100.0
    # Analysis window per envelope sample, at 2x the hop -- the same overlap
    # rule extract.rms.frame_s uses.
    frame_s: 0.02

    # How much envelope the share is measured over. Two seconds is eight cycles
    # at the bottom of the band and fourteen at the top. MEASURED on the
    # laughter fixture -- the gap between the worst in-band region and the best
    # non-in-band one, which is what a threshold has to fit inside:
    #
    #   window  order   worst in-band   best other    gap
    #     1.0     4         0.700          0.453     0.247
    #     1.0     6         0.775          0.459     0.316
    #     2.0     4         0.709          0.416     0.293
    #     2.0     6         0.791          0.422     0.369   <-- shipped
    #
    # Longer windows mostly help the DENOMINATOR: unmodulated noise wanders in
    # and out of the band by chance, and averaging over more of it pulls the
    # false-positive ceiling down.
    score_window_s: 2.0

    # Below this the score is a ratio of two noise floors -- a number with no
    # referent -- so it is stored as NaN rather than as a value.
    floor_db: -55.0

    # A SHARE ALONE IS NOT ENOUGH. The share is scale-free, so a noise floor
    # whose tiny random fluctuation happens to sit in the band scores exactly as
    # high as a real laugh. MEASURED: without this gate the SPEECH fixture --
    # which authors no laughter at all -- produced ten laugh events.
    #
    # §5.5's own words are "rapid periodic BURSTS", and a burst has depth. This
    # is the band component's swing relative to the local level, so it is still
    # scale-free and still says nothing about loudness. MEASURED on the laughter
    # fixture: modulation authored at depth 0.3 and 0.8 read 0.21 and 0.55;
    # unmodulated noise, out-of-band regions and the floor all read 0.013-0.017.
    # 0.1 sits an order of magnitude clear of the noise and below the shallowest
    # modulation the fixture authors.
    min_depth: 0.1

    # Butterworth order. MEASURED above: 6 beats 4 on every window length, and
    # the reason is worth knowing -- a Butterworth's cutoffs are its -3 dB
    # POINTS, not the edges of a flat passband. Modulation at exactly 7 Hz is
    # therefore half-power attenuated by a filter "at 4-7 Hz", and at order 4 the
    # band-edge region scored 0.70 against mid-band's 1.00. A sharper filter
    # narrows that penalty; it does not remove it, which is why the threshold
    # below is set from the worst in-band case rather than from the typical one.
    filter_order: 6

  rms:
    # Analysis window per sample. Longer is smoother and less responsive; at
    # 2x the hop each sample overlaps its neighbours by half.
    # §5.4.1 implies librosa's default 2048 samples (128 ms at 16 kHz).
    frame_s: 0.2

    # Digital silence is 20*log10(0) = -inf, which poisons every downstream
    # mean, z-score and plot. Floor it instead.
    #
    # COUPLED TO score.zscore_std_floor: a stretch at this floor is perfectly
    # constant, so its rolling standard deviation is zero and §6.2's z-score
    # divides by it. Tune one, look at the other.
    db_floor: -80.0

score:
  # §6.5's PROFILE SET. "Marvel Rivals streams: run BOTH profiles plus
  # combined." A moment is one candidate row carrying every profile's score
  # (§3.2 gives the row three score columns), and §7.4 reviews the combined
  # winners first.
  #
  # The FIRST profile is the primary: its column is score_entertainment, its
  # weighted breakdown is what `contributing_signals` explains, and it is what
  # `score_combined` mirrors when the set has only one member.
  #
  # §6.5's other two cases are one-line changes:
  #   casual / comedy (Valorant QP, Roblox, co-op)  ->  [entertainment]
  #   a Phase 1 comparison against old generations  ->  --profile naive
  #
  # CHANGING THIS CHANGES config_version, so the next `score` run mints a new
  # generation and carries operator ratings onto it by time overlap. That is
  # §6.1's whole promise -- re-scoring is free -- not a warning.
  profiles: [entertainment, gameplay]

  # DEVIATION from §6.2 step 2, which downsamples to 1 Hz. A 4-hour stream is
  # 144k samples at 10 Hz and rolling stats are cumulative-sum cheap, while 1 Hz
  # quantizes window edges to a whole second against §7.3's 0.5 s nudges.
  score_grid_hz: 10.0

  # §17. The 5-minute centred window that makes signals comparable *within* a
  # session — mic gain drifts, games differ, energy changes over three hours.
  rolling_baseline_window_s: 300

  # NOT IN §17 — added because §6.2 step 3 divides by a rolling sigma and says
  # nothing about sigma approaching zero. A near-silent five minutes has
  # sigma ~ 0, so dither becomes z = 50 and the top candidate of every stream is
  # a quiet moment. Units: dB, matching mic_rms. Tune against: whether quiet
  # stretches produce spurious candidates.
  #
  # COUPLED TO extract.rms.db_floor: a stretch pinned at that floor is exactly
  # constant, so its sigma is exactly zero. This is the value that keeps the
  # division finite.
  zscore_std_floor: 0.5

  # THE FLOOR ABOVE IS IN DECIBELS, AND NOT EVERY SIGNAL IS.
  #
  # Phase 3 adds signals on other scales: sudden_silence, overlap_speech and
  # input_stillness are 0..1, mic_f0_variance is semitones. For any binary-ish
  # signal firing less than 25% of the time, sigma is below 0.5 — so the dB
  # floor binds and z comes out at exactly ~2.0 whenever it fires, however rare
  # it is. Without a floor the same signal would reach z ~ 12 and dominate every
  # stream, so 0.5 was rescuing it by accident of a number chosen for a
  # different unit.
  #
  # One floor per signal instead, with `zscore_std_floor` as the default for
  # anything not named here. Each value is "the smallest sigma that is
  # meaningful for this signal", which is genuinely per-signal.
  #
  # ARBITRARY, all of them, and see spec/GUESSES.md for what would show each
  # one wrong. Raise a value to compress that signal's z-range, lower it to let
  # rare firings score higher.
  zscore_std_floor_by_signal:
    # 0..1 gates. 0.05 lets a signal that fires 1% of the time reach z ~ 4 and
    # one that fires 20% reach z ~ 2, which is the ordering C2 wants: rarer is
    # more notable.
    sudden_silence: 0.05
    overlap_speech: 0.05
    input_stillness: 0.05
    # Semitones. Ordinary speech varies by a few semitones over five seconds, so
    # a sigma below a quarter of one is a measurement artefact rather than a
    # monotone speaker.
    mic_f0_variance: 0.25

  # -------------------------------------------------------------------------
  # §5.4.1's derived signals, computed at SCORE time rather than stored.
  #
  # Each is a pure function of a stored primitive plus a tunable, and storing it
  # would freeze that tunable into every stream ever processed (C3). Same
  # boundary as storing absolute dB rather than baselined RMS, and raw marker
  # press times rather than t-20. Retuning any number below costs a re-score,
  # which §6.1 promises is free, instead of a re-extraction of the library.
  # -------------------------------------------------------------------------
  derived:
    # mic_f0_variance — §5.4.1: "rolling std of mic_f0 over 5 s. High prosodic
    # range = comedic delivery." §6.5 weights it 1.8, the highest continuous
    # weight in the entertainment profile.
    #
    # Computed in SEMITONES, not hertz. Pitch is log-distributed: +20 Hz at
    # 100 Hz is three and a half semitones and the same rise at 300 Hz is one,
    # so a deviation over linear hertz understates exactly the excursions this
    # signal exists to find. CLAUDE.md's "dB are logarithms" rule, inverted.
    f0_variance_window_s: 5.0
    # Below this many voiced samples in the window the answer is NaN, not zero.
    # A "prosodic range" measured over two voiced frames is noise wearing the
    # name of a signal, and zero would claim the speaker was monotone.
    f0_variance_min_observations: 8

    # sudden_silence — §5.4.1: "RMS falls below floor within 2 s of high
    # activity. Death, shock, concentration. Inverse of intuition."
    #
    # DEVIATION: "floor" is read relative to the rolling baseline, not as an
    # absolute dBFS number. An absolute floor bakes this microphone's gain and
    # this room into the signal, so a quietly recorded stream would be silent by
    # definition and any setup change would need a retune.
    #
    # AND THE DROP IS THE SIGNAL, NOT THE LEVEL. The first cut tested "z below a
    # negative threshold" and MEASURED zero firings, because on any real stream
    # SILENCE IS THE BASELINE: the operator is not talking most of the time, so
    # the rolling mean sits near the quiet level and z during silence is about
    # zero, never meaningfully negative. Waiting for silence to fall below its
    # own baseline waits forever. `drop_z` is what detects; `quiet_z` is only a
    # ceiling confirming it really is quiet now.
    silence:
      lookback_s: 2.0        # §5.4.1's own "within 2 s"
      activity_z: 1.0        # what counts as the "high activity" before it
      drop_z: 1.5            # how far below the recent peak counts as a fall
      quiet_z: 0.5           # and an upper bound on "quiet" in its own right
      ramp_s: 0.5            # 0->1 over this, so it is not a square wave

    # overlap_speech — §5.4.1: "VAD on both tracks, boolean AND. Everyone
    # talking at once = something happened."
    #
    # Deterministic energy gate, not a model (C1). §4.2 records the tracks
    # separately and the operator wears headphones, so there is no acoustic path
    # from the party's voice into the mic: energy on the mic track IS the
    # operator talking. A model would mean silero via the optional `asr` extra,
    # which is off by default — so this signal would be missing from every
    # stream that exists.
    vad:
      margin_db: 6.0         # above the track's own rolling baseline
      min_speech_s: 0.3      # a shorter run is a click, not a word
      hangover_s: 0.4        # bridges the gaps between words in one sentence

    # input_stillness — §5.4.1: "inverse of input_rate, GATED. Sudden stillness
    # after activity." Gated is the whole word: an hour of no input is someone
    # not playing; a second of stillness after frantic input is a death.
    #
    # Requires input_coverage, so a stretch where the logger was not running is
    # UNKNOWN rather than still. Nothing produces input signals until the
    # input_signals stage lands, so this is inert today.
    stillness:
      lookback_s: 3.0
      active_rate: 3.0       # events/s that counts as "was busy"
      quiet_rate: 0.5        # and events/s that counts as "now still"
      ramp_s: 0.5

    # reaction_onset — §5.4.3: "sudden_silence followed within 2 s by
    # overlap_speech + party_rms spike. Classic 'oh my god' moment." §6.5
    # weights it 1.5.
    #
    # Emitted as EVENTS, not a level: it names a moment, and §5.4.3's sibling
    # flick_signature says "emit composite event" for the same shape. So it goes
    # through score.events' Gaussian kernel like every other event.
    #
    # THE OVERLAP MUST BEGIN AFTER THE SILENCE, not merely be present during it.
    # sudden_silence says the mic went quiet and overlap_speech says both mics
    # are live, so the only way both hold at one instant is inside the speech
    # gate's hangover. MEASURED: a concurrent test fired on the speech fixture at
    # 54.6 s, where the operator stops while the party carries on -- a real
    # moment detected through a constant chosen to stop one sentence being
    # chopped into nine. §5.4.3's word is "followed".
    reaction:
      window_s: 2.0          # §5.4.3's own "within 2 s"
      silence_level: 0.5     # how far sudden_silence must have ramped
      party_spike_z: 1.0

    # §5.4.2's laugh_operator / laugh_party events, from extract.laughter's
    # continuous score. The THRESHOLD lives here rather than in extraction for
    # the same reason as everything else in this block: it is a tunable, and
    # baking it into a stored series would make retuning it a re-extraction.
    #
    # 0.60 is the midpoint of the MEASURED gap on the laughter fixture: the
    # worst in-band region scored 0.791 (6.8 Hz, at the band edge where a
    # Butterworth is already -3 dB) and the best non-in-band one 0.422
    # (unmodulated noise wandering into the band by chance).
    #
    # C2 (recall over precision) argues for lowering it once there is real
    # footage: a missed laugh costs a clip, a false one costs three seconds of
    # review. It is at the midpoint rather than lower because nothing here has
    # ever seen a real laugh, and inventing recall against synthetic material
    # would be a guess dressed as a measurement.
    laughter:
      threshold: 0.60
      # THE gate that separates laughter from speech, and the number is measured
      # rather than chosen. §5.5 says "rapid periodic bursts" -- periodic means
      # SUSTAINED, and this is what tests for it.
      #
      # What crosses the threshold and for how long, MEASURED:
      #
      #   speech fixture, mic (no laughter authored anywhere):
      #     13 runs, every one between 0.1 s and 2.2 s, each landing about
      #     1.7 s after an utterance ENDS -- the offset transient, smeared by
      #     score_window_s. A step is not periodic; it just looks like one for
      #     about a window.
      #   laughter fixture (6 s authored regions):
      #     runs of 4.8, 6.8, 7.4 and 7.5 s.
      #
      # 3.0 sits above every false run and below every true one. THE COST IS
      # REAL: a laugh shorter than three seconds is not detected, which C2 would
      # normally refuse. It is the honest setting anyway, because the material
      # that would price that trade -- actual laughter -- does not exist yet,
      # and admitting every speech transient is not recall, it is noise.
      min_duration_s: 3.0

  # §6.2 step 6.
  smoothing_sigma_s: 2.0

  peak:
    # §17 says "tune to 80-150 candidates/3 h" — a target, not a number. So the
    # default is to solve for it by bisection rather than guess. Set
    # `prominence` to a float to pin it and disable calibration.
    prominence: null
    auto_calibrate: true
    target_candidates_per_hour: [27, 50]   # 80-150 per 3 h, §6.7
    max_iterations: 24
    # §6.7's rate is per hour, so a 60 s test fixture targets 0.45 candidates
    # and a 10-minute one targets 4.5. Floor the target so short streams still
    # produce something reviewable; when no prominence reaches the range at all,
    # the closest achievable is used and the shortfall goes to tool_metrics.
    min_candidates: 3

  window:
    # §17 / §6.3.
    min_window_s: 8
    max_window_s: 60
    # §6.3's expansion loop reads only the exit threshold, which leaves
    # hysteresis_enter with no defined role despite §17 listing it as tunable.
    # Here it is the PEAK-MERGE threshold: a later peak opens a new window only
    # if the composite dipped below enter * v_peak since the previous one.
    # Otherwise the two peaks belong to one moment.
    hysteresis_enter: 0.6
    hysteresis_exit: 0.35
    # How to satisfy min/max when hysteresis disagrees: grow or shrink around
    # t_peak, keeping the peak inside. (§6.3 says "clamp" without saying how.)
    clamp_mode: expand_around_peak
    # §6.3. Real since Phase 2 supplies word timestamps.
    snap_to_word_boundaries: true
    # NOT IN §6.3, which says only "snap to nearest word boundary". A window
    # that ends in silence has no word near it, and nearest-boundary snapping
    # would drag the edge to a word twenty seconds away. Beyond this the
    # boundary stays where the composite put it.
    #
    # Direction is not symmetric either: the start prefers a word start at or
    # BEFORE it and the end a word end at or AFTER it, so the window grows onto
    # the boundary rather than shrinking off it. §8.2 says the point of snapping
    # is "no clipped syllables", and nearest can clip.
    snap_max_distance_s: 0.5

  spacing:
    # §17 / §6.6.
    window_s: 30
    factor: 0.5
    # §6.6 as written penalizes a third candidate twice (0.5 * 0.5) and freezes
    # iteration order against pre-penalty scores. `accepted_only` = single-pass
    # non-max suppression where only un-suppressed peaks suppress others.
    # `spec_literal` reproduces §6.6 exactly, for comparison.
    mode: accepted_only

  markers:
    # §17 / §4.3. Retained as the plateau's centre of mass so the §17 tuning
    # procedure still applies to it.
    retro_offset_s: 20.0
    # §4.3 says realization plus reaction is 5-15 s — a RANGE. A symmetric bump
    # at t-20 is a point estimate that misses by ~14 s when the true delay was
    # 6 s. The kernel instead plateaus across the whole plausible span and falls
    # off over `shoulder_s`. Serves C2 (recall over precision).
    pre_s: 25.0
    post_s: 5.0
    shoulder_s: 3.0
    # How overlapping marker kernels combine. `max` because the kernel means
    # "this moment is marked" and the plateau already carries the timing
    # uncertainty: two presses eight seconds apart describe ONE moment, and
    # summing them would give marker_definite a contribution of 6.0 and let a
    # flurry of presses dominate the whole stream's ranking.
    combine: max

  # Kernels for event kinds that are not markers (Phase 3+: kills, laughs,
  # phrases). Summing IS right for those -- three kills in eight seconds
  # genuinely is stronger evidence than one -- which is why markers are the
  # exception rather than the rule.
  events:
    default_sigma_s: 3.0
    combine: sum

  # A local maximum in negative territory is a local maximum of QUIETNESS.
  # §6.3's exit = 0.35 * v_peak also assumes a positive peak: for v_peak = -2
  # the exit threshold is -0.7, above the peak, so window expansion terminates
  # immediately and produces nothing.
  min_peak_value: 0.0

  # Fraction of overlap (intersection over union) required to carry an operator
  # rating onto the matching candidate in a new generation.
  rating_inherit_min_overlap: 0.5

  # -------------------------------------------------------------------------
  # §6.4's NEGATIVE signals. "This is a specific requirement and must be
  # implemented exactly as described." Two rules carry the section:
  #
  #   - a negative never fires while audio says something is happening, and
  #   - the logic is ONE shared gating helper, not per-signal ad hoc code.
  #
  # Both live in score/gates.py. What follows is only the numbers, and §6.4
  # supplies two of the seven.
  # -------------------------------------------------------------------------
  negatives:
    # NOT IN §6.4, WHICH SAYS "ramping in gradually (not a step function)" AND
    # NAMES NO DURATION. §17 has no row for it either. ARBITRARY.
    #
    # One thing about it is not arbitrary: §6.2 smooths the composite with
    # `smoothing_sigma_s` AFTER the penalty is applied, so a ramp much shorter
    # than that sigma is smoothed into something indistinguishable from a step
    # and §6.4's requirement stops meaning anything. Keep it comfortably above
    # score.smoothing_sigma_s.
    ramp_s: 4.0

    # MENU / LOBBY. §6.4:
    #   IF menu_screen_active AND no_speech_detected_for >= 8 seconds
    #      AND audio_energy < rolling_baseline
    #   THEN apply penalty, ramping in gradually
    #   ANY speech detected -> reset the 8-second timer to zero, remove penalty
    #
    # "Requirement: jokes in the lobby must never be penalized."
    #
    # INERT TODAY, and deliberately not pretended otherwise: menu_screen is a
    # §5.9 vision output and Phase 7 has not been built. The gate reads
    # `menu_screen` rows from the events table as spans (events.t .. t_end), so
    # vision has a contract to write against -- and it must set t_end, since a
    # row without one covers a single sample and can never satisfy the grace
    # period below.
    menu_grace_period_s: 8       # §17 and §6.4 both state it
    # ARBITRARY. §6.4 says "apply penalty" and never says how much. The unit is
    # the one every weight here uses -- roughly one standard deviation of
    # notability per 1.0 -- so 2.0 is "about as much as two ordinary signals
    # firing at once". Subtracted, never multiplied: the composite is signed,
    # and scaling a negative composite RAISES it.
    menu_penalty: 2.0

    # AFK. §6.4:
    #   IF no_input_activity AND no_speech FOR >= 60 continuous seconds
    #   THEN apply penalty
    #   "Both conditions required. Either one alone is insufficient."
    #
    # AND A THIRD CONDITION THAT §6.4 DOES NOT STATE: input_coverage. §4.4's
    # logger can start late, crash or be restarted, and every stream that exists
    # today has no input log at all. A stretch with no records is UNKNOWN input,
    # not idle input, and reading absence as idleness is how this penalty would
    # hold an entire stream down for something nobody observed.
    afk_threshold_s: 60          # §17 and §6.4 both state it
    afk_penalty: 2.0             # ARBITRARY, as menu_penalty
    # WHAT "no input activity" MEANS, which §6.4 does not say. §4.4's logger
    # records keys+clicks (§5.4.1's input_rate) and mouse velocity as separate
    # fields, and a mouse moving with no clicks is input activity. Both must be
    # idle. 0.0 is the literal reading of "no"; raising either makes the penalty
    # easier to fire, which is the direction C2 argues against -- a false AFK
    # penalty costs a clip, a missed one costs three seconds of review.
    afk_max_input_rate: 0.0            # events/s
    afk_max_mouse_velocity_px_s: 0.0   # px/s

  combined:
    # §6.5's score_combined, "the most valuable output": the intersection of
    # mechanics and personality, which is what is not commoditized.
    #
    # §6.5's formula is `(e_n ** alpha) * (g_n ** (1 - alpha)) * (e_n + g_n)`
    # and leaves `normalize` undefined -- see score/combined.py, which has to
    # define it, because a composite of weighted z-scores is SIGNED and a
    # fractional power of a negative is NaN.
    #
    # alpha weights which profile the geometric part leans on: 0.5 is even,
    # above 0.5 favours entertainment. §17's tuning target is "whether combined
    # winners are actually the best clips", which needs footage. Until then the
    # honest measure is `combined_rank_agreement` in tool_metrics -- how much
    # the combined ranking differs from entertainment's at all.
    alpha: 0.5

review:
  host: 127.0.0.1
  port: 8765
  # §7.1's hard target, in milliseconds per candidate. Reported by
  # `clipforge metrics`, not enforced.
  target_ms_per_candidate: 4000

  # §7.4's four sections: combined winners, entertainment, gameplay, then
  # marker-anchored as a safety net. They are DISJOINT -- a candidate appears in
  # the first section it qualifies for -- because listing one moment three times
  # would spend §7.1's four-second budget rating the same window three times.
  sections:
    # How many candidates the combined section holds. §7.4 says "combined-score
    # winners (both profiles high)" and gives no size.
    #
    # ARBITRARY. §7.1 reviews ~120 per session and §6.7 targets 80-150 per 3 h,
    # so 20 is about a sixth: a first screen the operator can get through before
    # forming an opinion on whether the section is worth anything. That opinion
    # is the falsifier -- combined_rank_agreement says how much the section even
    # differs from the entertainment ranking below it.
    combined_top_n: 20

  # §7.3's `[`/`]`/`{`/`}` keys, which move a window boundary by this much.
  # §7.3 states 0.5 s.
  #
  # A nudge is NOT clamped to score.window.min_window_s / max_window_s, and that
  # is the whole point rather than an oversight. §17 tunes those two against
  # "how often the operator nudges boundaries during review", so refusing a
  # nudge that leaves their range would make the measurement circular: the
  # operator could never record "I wanted this shorter than 8 s", which is
  # exactly the observation being collected. The only floor is arithmetic --
  # a window may not invert or leave the recording.
  nudge_step_s: 0.5

  # NOT IN THE SPEC. §2.2 says "local web app" and nothing about who may talk to
  # it, which was harmless while every route was read-only. A file browser and a
  # "run the pipeline" trigger are reachable by every page open in the browser:
  # loopback keeps other machines out, not other tabs.
  #
  # Requests that change something must carry an X-ClipForge header. The value
  # is never checked -- sending it at all is what forces a CORS preflight that a
  # cross-origin page cannot pass. Set false only if something other than the
  # bundled UI has to POST here.
  require_header: true
  # Host names this server will answer to, beyond loopback and review.host. The
  # Host check is what catches DNS rebinding, which makes an attacker's page
  # genuinely same-origin and so defeats both the header and the Origin check.
  # Adding a name here is deliberately a config decision.
  allow_hosts: []

  browse:
    # A recording drive directory can hold thousands of files, sometimes over a
    # network. Cap the listing rather than stat()ing all of them.
    max_entries: 500

    # Extra directories to search when a file is DROPPED onto the add screen.
    #
    # Dropping does not upload anything: a browser hands a page `File.name` and
    # `File.size` but never a path, and §13.1 puts a master at 40-55 GB that is
    # already on this machine's disk. So the name and size are sent instead and
    # the server finds the file -- in the folders recordings have been
    # registered from before, then whatever folder is open, then these.
    #
    # Usually empty is right: the first two cover it once one stream exists.
    # Point this at an OBS output folder to make the very first drop work too.
    search_dirs: []
    # What counts as a recording worth offering. §4.2 mandates MKV or
    # fragmented MP4; the rest are here because footage arrives in them.
    media_extensions: ['.mkv', '.mp4', '.mov', '.flv', '.ts', '.m2ts', '.webm']

# ---------------------------------------------------------------------------
# RENDER -- §8's auto-finish renderer.
#
# Deliberately NOT under `extract` or `score`, which are the only subtrees that
# feed `config_version` (see config.py VERSIONED_SUBTREES). Changing a caption
# colour must not invalidate a candidate or force a re-score: nothing here can
# change which moments were detected, only how an approved one is finished.
#
# Almost every number below is a guess -- see spec/GUESSES.md. The crop
# coordinates in crop_templates.yaml are the worst of them and are marked
# ARBITRARY: they are placeholders until a real OBS layout is measured.
# ---------------------------------------------------------------------------
render:
  # master | proxy. Same meaning as export.source, kept separate because they
  # are different decisions: an FCPXML references the master for an editor to
  # conform against, while a burned-in short is the deliverable and wants the
  # quality source even when the FCPXML path is pointed at a proxy.
  source: master

  # Padding either side of the approved window, in seconds. C2 says a false
  # positive costs three seconds of review and a false negative costs a clip,
  # so the default expands rather than trims -- but only slightly, because a
  # short's first frame is the hook (§8.5) and dead air in front of it is worse
  # than a tight cut.
  handles_s: 0.25

  crop:                              # §8.4
    # The sidecar, resolved against clipforge/config/ when relative. Same
    # arrangement as phrases.yaml: coordinates are data the operator edits,
    # not settings, and they do not belong in this file.
    file: crop_templates.yaml
    # Which template to use when --template is not given. `full_frame` is a
    # centre crop of any 16:9 source and needs nothing measured, which is the
    # only honest default before a real layout exists.
    template: full_frame
    # Per-region default. `stretch` reproduces §8.4 literally and distorts its
    # own example by 23%; `fill` keeps geometry true and loses a sliver of
    # edge. A region may override this with its own `fit`.
    fit: fill
    # Shown wherever no region covers the output, and behind `contain`.
    pad_color: '#000000'
    # Warn when a region has to be enlarged more than this to fill its place
    # in the output. SOME upscaling is inherent -- a 16:9 master reframed to
    # 9:16 always enlarges by about 1.78x -- so warning on any enlargement at
    # all would fire on every clip and mean nothing. 2.0 is above that floor
    # and below the 3x a small facecam would need.
    upscale_warn_factor: 2.0

  audio:
    # Which §4.2 track becomes the clip's audio. §8.3's burn-in has a bare
    # -af, so ffmpeg takes the first audio stream -- which is the mix only by
    # luck of the OBS layout. A short carrying game audio and no voice is a
    # silent failure that survives all the way to upload.
    #
    # `auto` uses the probed track map: the `mixed` role if there is one, else
    # the lowest-indexed role found. Set an integer to force a stream index.
    source: auto

  video:
    # §8.3's encode settings. Deliberately NOT ingest.proxy's auto-detected
    # hardware encoder: that detector exists to push a three-hour proxy
    # through a throughput bottleneck, while a 45-second deliverable optimises
    # for quality, and NVENC/QSV at equal bitrate is visibly worse than x264.
    codec: libx264
    crf: 18
    preset: slow
    # A 10-bit or 4:2:2 master otherwise yields a clip half the platforms
    # cannot decode -- the same reason ingest.proxy forces it.
    pix_fmt: yuv420p
    audio_codec: aac
    audio_bitrate: 192k
    container: mp4

  loudness:                          # §8.2, §8.3
    enabled: true
    # §8.3's numbers. -14 LUFS is where the platforms normalise to, so
    # arriving there means they leave the audio alone.
    target_lufs: -14.0
    true_peak_db: -1.5
    lra: 11.0

    # TWO passes, not §8.3's one. MEASURED over six windows of the speech
    # fixture: one-pass averaged 1.50 LU of error, two-pass 0.43 LU. Set false
    # to reproduce §8.3 literally.
    two_pass: true

    # MEASURED, and the reason this key exists: two-pass over a SILENT window
    # landed 18 LU off (-32.0 LUFS against a -14 target), because pass 1's
    # measurements are meaningless and pass 2 believes them.
    #
    # A clip needing more gain than this to reach the target is left alone.
    # Expressed as GAIN rather than an absolute floor because gain is what does
    # the damage -- lifting a noise floor twenty dB is what makes hiss audible
    # -- and because it keeps its meaning if target_lufs moves.
    #
    # On the fixture: its authored silence reads -36.2 LUFS and would need
    # +22.2 dB; its quiet speech sits at -18 to -24 and needs 4 to 10.
    max_gain_db: 20.0

    # MEASURED: loudnorm resamples internally and hands the encoder 192 kHz
    # unless something pins the rate. AAC-LC tops out at 96 kHz.
    sample_rate_hz: 48000

    # The finished file is measured with ebur128 and WARNED about when it lands
    # outside this. Never a failure: the clip is postable either way, and
    # whether a decibel matters is the operator's call.
    #
    # 2.0 rather than 1.0 because of measured variance, not generosity: over
    # nine windows two-pass came out 0.63 LU off on average and 1.70 at worst,
    # and a 0.2 s shift in one window moved it 1.9 LU. A tolerance inside that
    # spread would fire on ordinary clips and stop being read.
    verify_tolerance_lu: 2.0

  # -------------------------------------------------------------------------
  # §8.2's export presets.
  #
  # THEY ARE NEARLY IDENTICAL, and this says so rather than inventing
  # differences to justify three blocks. Shorts, TikTok and Reels all take
  # 1080x1920 and all normalise to about -14 LUFS. The only thing that really
  # differs is a maximum duration, and those change -- the values below are
  # guesses (spec/GUESSES.md marks them ARBITRARY). Check the platform's
  # current documentation before trusting one.
  #
  # A preset carries ENCODE SETTINGS, not a resolution: §8.4 puts `output` in
  # the crop template and the template's dst rectangles are expressed in that
  # space, so a preset declaring a size would give one number two owners.
  #
  # max_duration_s WARNS and never truncates -- silently cutting an approved
  # clip loses the moment it was approved for (C2).
  # -------------------------------------------------------------------------
  presets:
    default: shorts

    shorts:
      note: YouTube Shorts
      max_duration_s: 180

    tiktok:
      note: identical to shorts today except the cap
      max_duration_s: 600

    reels:
      note: identical to shorts today except the cap
      max_duration_s: 90

  # -------------------------------------------------------------------------
  # §8.6 -- profanity muting. OFF BY DEFAULT, and §16 lists "profanity muting
  # by default" among the explicitly rejected features, so this is a toggle and
  # stays one. A render with no flags is byte-identical to one from before this
  # existed.
  #
  # Mute ranges are derived from word timestamps at export time, never stored:
  # §8.6 says "store mute ranges as data ... apply only at export time", and
  # the word timestamps ARE that data.
  # -------------------------------------------------------------------------
  mute:
    enabled: false

    # Padding either side of the word, in seconds. MEASURED: the boundary
    # leaks -- muting exactly 2.0-4.0s left the edges audible -- so a mute that
    # starts late leaves the consonant, which defeats the whole point. C2:
    # expand rather than contract.
    pad_s: 0.08

    # null -> phrases.yaml's `profanity` list, which already exists for §5.6's
    # swear_density signal. One list, one place to edit.
    words: null

  # -------------------------------------------------------------------------
  # §8.2 -- filler-word removal. OFF BY DEFAULT.
  #
  # § 8.2 describes this in one line ("word timestamps + concat filter") and
  # what that hides is that cutting a word cuts the VIDEO too. On a talking
  # head a jump cut is the house style; on gameplay the character teleports.
  # Whether it improves a clip is a taste question no fixture can answer --
  # turn it on, watch the result, and decide.
  # -------------------------------------------------------------------------
  filler:
    enabled: false

    # ARBITRARY, and general English rather than this operator's speech --
    # exactly the status of phrases.yaml's profanity list, and with the same
    # falsifier: ten streams of transcript would settle it in minutes.
    words: [um, uh, erm, uhm, hmm, like, basically, literally, honestly]

    # §4.2 roles this may cut from. Cutting the OTHER person's speech because
    # the operator said "um" is not a thing anyone wants.
    roles: [mic]

    # Below this a cut is a glitch rather than an edit.
    min_duration_s: 0.12
    # Two removals closer than this leave an island of audio between them that
    # reads as a stutter. Merging takes the island with them.
    merge_gap_s: 0.35
    # Refuse the WHOLE plan if it would remove more than this share of the
    # clip. That is not "the clip was full of filler", it is a word list
    # matching something it should not -- and silently deleting a third of an
    # approved moment is the failure worth stopping for.
    max_share: 0.25

  # -------------------------------------------------------------------------
  # §8.5 -- hook text. "The hook [...] is the single highest-leverage decision
  # in short-form. It stays manual, but generating candidate options is a
  # genuine time save."
  #
  # `manual` is the paste round trip: `clipforge hook` writes a prompt, you
  # paste it into a frontier model, and the reply is validated against §12's
  # rules on the way back in. An API-backed source would slot in beside it --
  # §12.4 prices one at roughly $0.10-0.30 per stream -- but needs a key.
  # -------------------------------------------------------------------------
  hooks:
    source: manual
    # §8.5 says five variants.
    options: 5

  verify:
    # Checked by ffprobe after every encode, the same way the proxy checks
    # itself. A clip that came out the wrong size or short is worth catching
    # here rather than on the upload page.
    max_duration_delta_s: 0.5

  captions:                          # §8.3
    enabled: true

    # §8.3: "3-5 words on screen at a time, with the currently-spoken word
    # highlighted. This is the format that reads at short-form pacing."
    # `group_size` is the target; `min_group_size` stops a run ending with one
    # word alone on screen.
    group_size: 4
    min_group_size: 3

    # A silence longer than this ends a group. Without it, the word before a
    # four-second pause shares the screen with the word after it and the
    # highlight sits on a word nobody is saying.
    max_gap_s: 1.2
    # How long the last word of a group holds after it finishes. Never runs
    # into the next group or past the end of the clip.
    tail_hold_s: 0.35
    # A highlight state shorter than this is skipped -- the word stays on
    # screen as part of its group but never becomes the active one. Two words
    # sharing a start (an interpolated pair) is what produces this.
    min_line_s: 0.08
    # 0 = libass smart wrapping, 2 = no wrapping. 0, so an unusually long group
    # wraps instead of running off the frame.
    wrap_style: 0
    # Short-form convention is uppercase; off by default because it is a taste
    # decision and the transcript's own casing is information.
    uppercase: false

    # Shared style, overridden per speaker below. Sizes and margins are in
    # PlayRes units, which the renderer sets to the OUTPUT resolution (§8.4's
    # 1080x1920), not the master's.
    font: Arial
    font_size: 64
    bold: true
    outline: 3.0
    shadow: 0.0
    outline_colour: '#000000'
    border_style: 1                  # 1 = outline + shadow, 3 = opaque box
    alignment: 2                     # numpad layout; 2 = bottom centre
    margin_l: 60
    margin_r: 60
    margin_v: 220
    colour: '#FFFFFF'

    # A3: these are #RRGGBB and the renderer converts to ASS's BGR.
    #
    # The active word's colour. §8.3 does not name one -- it is the thing that
    # makes word-level highlighting visible at all.
    highlight: '#FFD400'

    # §8.3's per-speaker colouring. Keyed by §4.2 ROLE, resolved from
    # `segments.track` rather than `segments.speaker` -- see render/words.py for
    # why `speaker` cannot decide this.
    #
    # `margin_v` differs per role on purpose: two people talking at once
    # produce two simultaneous groups, and distinct margins stack them instead
    # of drawing them on top of each other. With one speaker this is invisible.
    styles:
      mic:                           # the operator. §8.3's "color A"
        colour: '#FFFFFF'
        margin_v: 220
      party:                         # §8.3's "color B"
        colour: '#7FE7FF'
        margin_v: 330
      default:                       # no track and no speaker to read
        colour: '#FFFFFF'
        margin_v: 220

# ---------------------------------------------------------------------------
# BACKUP -- §13.2. The database is "THE IRREPLACEABLE TIER": signals can be
# re-extracted from footage, the operator's judgment calls cannot.
#
# `clipforge backup` takes one; `clipforge backup --schedule` prints the
# schtasks line for the nightly run; `clipforge backup --verify` is §13.3's
# "an untested backup is not a backup".
# ---------------------------------------------------------------------------
backup:
  # Resolved against the project root like every other path. Under data_root by
  # default so one directory holds everything the app owns -- but see
  # mirror_dir: that also means it is on the same disk as the database.
  dir: ./data/backups

  # §13.2's gzip step. MEASURED on this database: 408 KiB -> 88 KiB, 78%
  # smaller, and the whole backup takes about 30 ms.
  compress: true

  # §13.2 states both numbers. The RULE is not in the spec: keep the newest
  # `keep_daily` backups, then the newest one in each of the `keep_monthly` most
  # recent months, and delete the rest. The newest backup is never deletable
  # whatever these say, so a typo here cannot empty the directory.
  keep_daily: 30
  keep_monthly: 12

  # NOT IN §13.2, which says "upload to B2/S3". There is no account and C5 says
  # not to build ahead of the data -- but a .gz sitting beside its source is not
  # protection against the disk dying, only against a bad migration or a
  # mistaken delete. This is the version available with no credentials: a second
  # plain directory. An external drive, or a folder OneDrive/Dropbox already
  # syncs. A failed mirror WARNS and never fails the backup -- an unplugged
  # drive must not mean no backup at all.
  mirror_dir: null

  # Only used to fill in the printed schtasks line. Arbitrary: late enough that
  # a stream is over, early enough to be before the next one.
  schedule_time: '04:00'

export:
  fcpxml_version: '1.10'
  # master | proxy. The master is the quality source; the proxy is the fallback
  # when it is on a disconnected drive.
  source: master
  handles_s: 0.0

# ---------------------------------------------------------------------------
# DEFERRED — parameters for phases that are not built.
#
# Present so that §17 is fully represented in config from day one and nobody
# hardcodes them later, but visibly not yet wired to anything. Moving one out of
# this block is part of building the phase that consumes it.
# ---------------------------------------------------------------------------
deferred:
  # negatives.{menu_grace_period_s,afk_threshold_s} moved to score.negatives --
  # score/gates.py reads them now (§6.4). The menu gate is still inert for want
  # of a Phase 7 producer, but the parameter is wired, not deferred.
  # laughter.band_hz moved to extract.laughter.band_hz -- something reads it now.
  trends:             # §11, Phase 6
    hdbscan_min_cluster_size: 5
    ngram_recency_halflife_days: 30
