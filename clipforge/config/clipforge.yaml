# ClipForge configuration — packaged defaults.
#
# §17 is emphatic: every tunable value lives in a config file, never hardcoded.
# All fourteen rows of that table appear below. Values are educated guesses, not
# validated numbers (C5) — they exist to be tuned against real footage.
#
# LAYERING (lowest priority first):
#   1. this file
#   2. clipforge/config/local.yaml   (gitignored — machine-specific paths)
#   3. --config FILE  or  $CLIPFORGE_CONFIG
#   4. command-line flags
#
# PATHS: a relative path resolves against the *project root* (the directory
# holding pyproject.toml), not the current working directory, so commands behave
# the same from anywhere in the tree. `clipforge config show` prints the
# resolved absolute paths.

config_schema: 1

paths:
  data_root: ./data
  # null -> $CLIPFORGE_FFMPEG, then PATH. Set these in local.yaml on a machine
  # where ffmpeg is not installed globally.
  ffmpeg: null
  ffprobe: null
  # null -> <data_root>/clipforge.db
  db: null

ingest:
  stream_id_slug_max_len: 40

  probe:
    # Seconds of presentation timestamps sampled to decide constant vs variable
    # frame rate. The classifier fits PTS against a constant rate and checks the
    # residual, because neither frame durations nor PTS deltas can tell the two
    # apart: an MKV on a 1 ms timebase stores CFR 30 fps as alternating 33/34 ms
    # frames, and ffprobe's duration_time field reports a nominal value that
    # cannot detect real VFR at all. Two windows are sampled -- the start, and
    # mid-file, since a recording can begin CFR and degrade once the encoder is
    # under load. Longer is more evidence and more probe time.
    rate_sample_seconds: 4.0

  # §5.2. The proxy exists for scrubbing speed, not storage (§13.1).
  proxy:
    height: 720
    video_bitrate: 2M
    preset: veryfast
    audio_bitrate: 128k

    # §5.2 specifies libx264, i.e. CPU encoding. MEASURED on the build machine,
    # same file (682 s of 720p60), same bitrate and GOP settings:
    #
    #   libx264 veryfast   333.0 s   2.0x realtime   175 MB
    #   h264_qsv           139.5 s   4.9x realtime   181 MB
    #
    # Both produced keyframes exactly every 30 frames, so A2 holds either way.
    # 2.4x from a weak integrated GPU; a discrete NVENC card is several times
    # faster again. Extrapolated to a 4-hour stream that is ~2.0 h of CPU
    # encoding versus ~49 min here and well under that on real hardware,
    # against §1.3's 20-40 minute budget for ALL unattended processing -- a
    # budget Phase 2's WhisperX also draws on. A faster CPU halves the first
    # number and still misses.
    #
    # `auto` resolves at run time by actually test-encoding a fraction of a
    # second with each candidate, in preference order, and taking the first
    # that works. Listing an encoder is not detection: this build ships
    # h264_nvenc and it fails with "Cannot load nvcuda.dll" on a machine with
    # no NVIDIA driver.
    #
    # Set a specific codec name to pin it. `libx264` is always the fallback.
    video_codec: auto
    codec_preference: [h264_nvenc, h264_qsv, h264_amf, libx264]

    # Per-encoder settings, because one flat block cannot serve both. NVENC has
    # no scenecut threshold, uses p1-p7 rather than x264's preset names, and
    # needs its own rate control.
    #
    # Fixed GOP is what A2 requires and what makes seeking instant, so each
    # entry must produce it. If one of these is wrong, the proxy stage's
    # post-encode keyframe check fails loudly rather than silently shipping a
    # proxy that scrubs badly -- which is what makes it safe to ship encoder
    # settings that could not be tested on the build machine.
    codecs:
      libx264:
        preset: veryfast
        args: ["-sc_threshold", "0"]
      h264_nvenc:
        preset: p4
        # -no-scenecut is the NVENC equivalent of x264's scenecut=0; -rc vbr
        # with -b:v gives the same bitrate target as libx264's ABR mode.
        args: ["-no-scenecut", "1", "-rc", "vbr", "-tune", "hq"]
      h264_qsv:
        preset: medium
        args: []
      h264_amf:
        preset: balanced
        args: ["-rc", "vbr_peak"]

    extra_output_args: []
    # A2: fixed GOP. Without sc_threshold=0, x264 inserts keyframes on scene
    # changes and seek granularity becomes unpredictable. gop=30 is 0.5 s at
    # 60 fps, 1 s at 30 fps.
    #
    # Verified against ffmpeg 9: libx264 still exposes a private sc_threshold
    # (default -1) that maps to x264's scenecut, so §5.2's flag does what it
    # says. It was a plausible casualty of deprecation, which would have voided
    # A2 silently -- hence the keyframe check after every encode.
    gop: 30
    keyint_min: 30
    sc_threshold: 0
    # NOT IN THE SPEC. §5.2 claims the proxy shares the master's timebase, which
    # is false for a VFR master, and its command has no -fps_mode. Forcing CFR
    # is what actually makes that claim true and keeps review timestamps and
    # export timestamps interchangeable.
    force_cfr: true
    # NOT IN §5.2 either. A 10-bit or 4:2:2 master -- some capture cards, and
    # OBS with certain encoder settings -- produces a proxy no browser can
    # decode, so the review UI shows a black player and no error at all.
    pix_fmt: yuv420p

    # Checked immediately after encoding, inside the stage, so a proxy that
    # does not match its master never becomes a completed artifact.
    verify:
      # Hard failure: every timestamp in the system assumes proxy and master
      # are interchangeable (§5.2, §13.1).
      max_duration_delta_s: 0.5
      # Hard for CFR masters, advisory for VFR ones -- forcing CFR legitimately
      # changes the frame count there.
      max_frame_delta: 2
      # A2's fixed GOP is the whole reason Phase 1 live-seeks the proxy instead
      # of pre-rendering previews (§7.2). Sample this many seconds of keyframes
      # and require the spacing to hold; 0 disables the check.
      keyframe_sample_s: 60.0
      max_keyframe_interval_ratio: 1.5

  # §5.3. 16 kHz mono is correct for WhisperX and every audio feature. Do not
  # raise it.
  #
  # STORAGE, which §13.1's table has no row for: 16 kHz mono s16le is ~115 MB
  # per hour per track, so mic+game+party over a 4-hour stream is ~1.4 GB and
  # ~140 GB across 100 streams -- comparable to the previews and metadata tiers
  # combined. Regenerable from the master, so safe to delete, but Phase 2's
  # WhisperX consumes them.
  audio:
    sample_rate_hz: 16000
    channels: 1
    codec: pcm_s16le
    # §5.3 maps a:1/2/3 and deliberately not a:0 -- the proxy already carries
    # the mix for review, so extracting it would add ~460 MB per stream for
    # something nothing analyses. Roles absent from the probed track map are
    # skipped, so a single-track file yields only mic.wav.
    extract_roles: [mic, game, party]
    verify:
      # A truncated extraction is silent corruption: it shows up much later as
      # candidates that stop appearing partway through a stream.
      max_duration_delta_s: 0.5
      # Sampled from a few blocks rather than by reading the file; a 4-hour
      # mono WAV is ~230 MB and the header already gives the frame count.
      silence_probe_blocks: 12
      # Peak below this counts as digital silence. A silent mic.wav means the
      # track mapping is wrong; a silent party.wav just means nobody was in
      # Discord -- so this warns and never fails.
      silence_peak_dbfs: -80.0
    # role -> ffmpeg audio stream index (§4.2's track layout).
    # null = infer from probe. A single-track file maps to `mic` and warns:
    # mic RMS is then contaminated by game audio, which §4.2 calls
    # unrecoverable after the fact.
    track_roles:
      mic: null
      game: null
      party: null

extract:
  # §5.4: all continuous signals are computed at 10 Hz and stored at 10 Hz.
  #
  # This is the ONLY place the hop is defined. There was briefly a separate
  # extract.rms.hop_s alongside it, which is one fact stated twice: set one
  # without the other and the series' declared sample rate stops matching its
  # actual spacing, silently shifting every timestamp derived from it. §5.4
  # says "10 Hz (100 ms hop)" -- the same fact, not two.
  signal_hz: 10.0

  # §5.7. Phase 2. Defaults are the spec's, which are right for the streaming PC
  # and impossible on a machine with no NVIDIA GPU -- see local.yaml.example for
  # the CPU block.
  whisperx:
    # OFF by default, and that is not timidity. §15 puts the transcript in
    # Phase 2 and is emphatic about shipping Phase 1 first; until
    # speaker_assign, speech_rate and phrase_detect exist, a transcript feeds
    # nothing. Leaving it on would mean every `clipforge run` pulls a 3 GB model
    # and, on a machine without a GPU, spends hours producing rows that nothing
    # reads. Turn it on when the rest of Phase 2 lands, or to experiment.
    #
    # When off, the stage reports as deferred and the run continues to `score`.
    enabled: false

    model: large-v3
    device: cuda

    # NOT IN §5.7, which hardcodes float16 because it assumes CUDA. CTranslate2
    # REJECTS float16 on CPU outright, so the spec's literal value fails with an
    # error naming neither the setting nor the cause. `auto` resolves per device;
    # an explicit value still wins.
    compute_type: auto

    # NOT IN §5.7 either, which sets no language and so detects one per chunk.
    # A chunk of near-silence or game noise is exactly where Whisper decides the
    # language is Welsh and hallucinates to match. null = auto-detect.
    language: en

    # §5.8: run separately on the mic and party tracks, then merge. The game
    # track is deliberately absent -- it is game audio, and transcribing it
    # produces confident nonsense that would then be scored and shown. A
    # single-track recording transcribes just mic.
    roles: [mic, party]

    batch_size: 16

    # A4: "VAD filtering must be enabled. Without it, Whisper hallucinates
    # phantom text over silence and music."
    #
    # silero rather than pyannote: whisperx's pyannote path fetches
    # pyannote/segmentation-3.0, which needs a HuggingFace account and licence
    # acceptance -- contradicting §5.8's own reason for avoiding pyannote ("no
    # Hugging Face token, no license acceptance, and no model"). MEASURED on the
    # build machine: pyannote's audio IO also fails here outright, because
    # torchcodec cannot load against torch 2.8+cpu.
    vad_method: silero
    vad_options:
      # §5.7's values. VERIFIED they apply to both methods in whisperx 3.8;
      # chunk_size is required by silero, whose binarization happens before the
      # chunks are merged.
      chunk_size: 30
      vad_onset: 0.5
      vad_offset: 0.363

    # §5.7: "run whisperx.align() for word-level timestamps. These drive
    # captions, cut-point snapping, and speech-rate calculation." Downloads a
    # wav2vec2 model (~360 MB) on first use. Turning this off leaves segments
    # with no words, which disables §6.3's boundary snapping.
    align: true

    # §5.7's vocabulary seeding. Resolved against this directory. A sibling
    # `vocabulary.local.txt` is merged when present and is gitignored -- §5.7
    # says to include "the girlfriend's name and any recurring nicknames", and
    # names of real people should not need a commit.
    vocabulary_file: vocabulary.txt

    # hotwords | prompt | both | none.
    #
    # §5.7 passes BOTH an initial_prompt and a hotwords list, and MEASURED that
    # is a trap. They are not exclusive -- faster-whisper's get_prompt
    # concatenates hotwords then the prompt into one sot_prev section -- but it
    # truncates each to `max_length // 2 - 1` = 223 tokens, and Whisper only has
    # positional encodings for 448. Framing tokens push the total to 451, so
    # seeding both at any real length fails with
    #   RuntimeError: No position encodings are defined for positions >= 448
    # raised from inside CTranslate2, with nothing pointing at the vocabulary.
    #
    # `hotwords` alone is also the more targeted mechanism: it is a term list,
    # where initial_prompt is meant to be a style-setting sentence. `both` still
    # works, with the term list trimmed to half the budget.
    vocabulary_mode: hotwords
    # Upper bound before the token budget trims further. Both limits exist: this
    # one keeps the file sane, the token budget keeps Whisper alive.
    max_vocabulary_terms: 160

  rms:
    # Analysis window per sample. Longer is smoother and less responsive; at
    # 2x the hop each sample overlaps its neighbours by half.
    # §5.4.1 implies librosa's default 2048 samples (128 ms at 16 kHz).
    frame_s: 0.2

    # Digital silence is 20*log10(0) = -inf, which poisons every downstream
    # mean, z-score and plot. Floor it instead.
    #
    # COUPLED TO score.zscore_std_floor: a stretch at this floor is perfectly
    # constant, so its rolling standard deviation is zero and §6.2's z-score
    # divides by it. Tune one, look at the other.
    db_floor: -80.0

score:
  # Default weight profile. Overridable per stream (streams.profile_used).
  profile: naive

  # DEVIATION from §6.2 step 2, which downsamples to 1 Hz. A 4-hour stream is
  # 144k samples at 10 Hz and rolling stats are cumulative-sum cheap, while 1 Hz
  # quantizes window edges to a whole second against §7.3's 0.5 s nudges.
  score_grid_hz: 10.0

  # §17. The 5-minute centred window that makes signals comparable *within* a
  # session — mic gain drifts, games differ, energy changes over three hours.
  rolling_baseline_window_s: 300

  # NOT IN §17 — added because §6.2 step 3 divides by a rolling sigma and says
  # nothing about sigma approaching zero. A near-silent five minutes has
  # sigma ~ 0, so dither becomes z = 50 and the top candidate of every stream is
  # a quiet moment. Units: dB, matching mic_rms. Tune against: whether quiet
  # stretches produce spurious candidates.
  #
  # COUPLED TO extract.rms.db_floor: a stretch pinned at that floor is exactly
  # constant, so its sigma is exactly zero. This is the value that keeps the
  # division finite.
  zscore_std_floor: 0.5

  # §6.2 step 6.
  smoothing_sigma_s: 2.0

  peak:
    # §17 says "tune to 80-150 candidates/3 h" — a target, not a number. So the
    # default is to solve for it by bisection rather than guess. Set
    # `prominence` to a float to pin it and disable calibration.
    prominence: null
    auto_calibrate: true
    target_candidates_per_hour: [27, 50]   # 80-150 per 3 h, §6.7
    max_iterations: 24
    # §6.7's rate is per hour, so a 60 s test fixture targets 0.45 candidates
    # and a 10-minute one targets 4.5. Floor the target so short streams still
    # produce something reviewable; when no prominence reaches the range at all,
    # the closest achievable is used and the shortfall goes to tool_metrics.
    min_candidates: 3

  window:
    # §17 / §6.3.
    min_window_s: 8
    max_window_s: 60
    # §6.3's expansion loop reads only the exit threshold, which leaves
    # hysteresis_enter with no defined role despite §17 listing it as tunable.
    # Here it is the PEAK-MERGE threshold: a later peak opens a new window only
    # if the composite dipped below enter * v_peak since the previous one.
    # Otherwise the two peaks belong to one moment.
    hysteresis_enter: 0.6
    hysteresis_exit: 0.35
    # How to satisfy min/max when hysteresis disagrees: grow or shrink around
    # t_peak, keeping the peak inside. (§6.3 says "clamp" without saying how.)
    clamp_mode: expand_around_peak
    # §6.3. No-op until Phase 2 supplies word timestamps.
    snap_to_word_boundaries: true

  spacing:
    # §17 / §6.6.
    window_s: 30
    factor: 0.5
    # §6.6 as written penalizes a third candidate twice (0.5 * 0.5) and freezes
    # iteration order against pre-penalty scores. `accepted_only` = single-pass
    # non-max suppression where only un-suppressed peaks suppress others.
    # `spec_literal` reproduces §6.6 exactly, for comparison.
    mode: accepted_only

  markers:
    # §17 / §4.3. Retained as the plateau's centre of mass so the §17 tuning
    # procedure still applies to it.
    retro_offset_s: 20.0
    # §4.3 says realization plus reaction is 5-15 s — a RANGE. A symmetric bump
    # at t-20 is a point estimate that misses by ~14 s when the true delay was
    # 6 s. The kernel instead plateaus across the whole plausible span and falls
    # off over `shoulder_s`. Serves C2 (recall over precision).
    pre_s: 25.0
    post_s: 5.0
    shoulder_s: 3.0
    # How overlapping marker kernels combine. `max` because the kernel means
    # "this moment is marked" and the plateau already carries the timing
    # uncertainty: two presses eight seconds apart describe ONE moment, and
    # summing them would give marker_definite a contribution of 6.0 and let a
    # flurry of presses dominate the whole stream's ranking.
    combine: max

  # Kernels for event kinds that are not markers (Phase 3+: kills, laughs,
  # phrases). Summing IS right for those -- three kills in eight seconds
  # genuinely is stronger evidence than one -- which is why markers are the
  # exception rather than the rule.
  events:
    default_sigma_s: 3.0
    combine: sum

  # A local maximum in negative territory is a local maximum of QUIETNESS.
  # §6.3's exit = 0.35 * v_peak also assumes a positive peak: for v_peak = -2
  # the exit threshold is -0.7, above the peak, so window expansion terminates
  # immediately and produces nothing.
  min_peak_value: 0.0

  # Fraction of overlap (intersection over union) required to carry an operator
  # rating onto the matching candidate in a new generation.
  rating_inherit_min_overlap: 0.5

  combined:
    # §17. Unused in Phase 1: one profile exists, so score_combined mirrors
    # score_entertainment and score_gameplay is 0.
    alpha: 0.5

review:
  host: 127.0.0.1
  port: 8765
  # §7.1's hard target, in milliseconds per candidate. Reported by
  # `clipforge metrics`, not enforced.
  target_ms_per_candidate: 4000

  # NOT IN THE SPEC. §2.2 says "local web app" and nothing about who may talk to
  # it, which was harmless while every route was read-only. A file browser and a
  # "run the pipeline" trigger are reachable by every page open in the browser:
  # loopback keeps other machines out, not other tabs.
  #
  # Requests that change something must carry an X-ClipForge header. The value
  # is never checked -- sending it at all is what forces a CORS preflight that a
  # cross-origin page cannot pass. Set false only if something other than the
  # bundled UI has to POST here.
  require_header: true
  # Host names this server will answer to, beyond loopback and review.host. The
  # Host check is what catches DNS rebinding, which makes an attacker's page
  # genuinely same-origin and so defeats both the header and the Origin check.
  # Adding a name here is deliberately a config decision.
  allow_hosts: []

  browse:
    # A recording drive directory can hold thousands of files, sometimes over a
    # network. Cap the listing rather than stat()ing all of them.
    max_entries: 500
    # What counts as a recording worth offering. §4.2 mandates MKV or
    # fragmented MP4; the rest are here because footage arrives in them.
    media_extensions: ['.mkv', '.mp4', '.mov', '.flv', '.ts', '.m2ts', '.webm']

export:
  fcpxml_version: '1.10'
  # master | proxy. The master is the quality source; the proxy is the fallback
  # when it is on a disconnected drive.
  source: master
  handles_s: 0.0

# ---------------------------------------------------------------------------
# DEFERRED — parameters for phases that are not built.
#
# Present so that §17 is fully represented in config from day one and nobody
# hardcodes them later, but visibly not yet wired to anything. Moving one out of
# this block is part of building the phase that consumes it.
# ---------------------------------------------------------------------------
deferred:
  negatives:          # §6.4, Phase 3/7
    menu_grace_period_s: 8
    afk_threshold_s: 60
  laughter:           # §5.5, Phase 3
    band_hz: [4.0, 7.0]
  trends:             # §11, Phase 6
    hdbscan_min_cluster_size: 5
    ngram_recency_halflife_days: 30
