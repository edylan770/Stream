[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Stream -> clip -> video pipeline. Phase 1 (spec §15)."
readme = "README.md"
# The build machine and the streaming PC are different boxes, so the floor stays
# low. The CEILING is not caution -- it is measured. WhisperX (§2.2's choice, and
# §5.7 is written entirely around its API) declares `python <3.14` in every
# release from 3.7.0 on. Without this bound pip silently resolves back to
# whisperx 3.2.0, which pins ctranslate2==4.4.0, which has no cp314 wheel -- so
# the failure surfaces as a C++ build error for a transitive dependency rather
# than as "your interpreter is too new".
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    # §5.4.1 names librosa.pyin for mic_f0/party_f0, and Phase 3 is where it
    # earns the numba/llvmlite install it drags in (~100 MB). Deliberately NOT
    # used for frame RMS, which is a few lines of numpy -- see
    # extract/features.py. Imported inside the pitch functions rather than at
    # module scope, so every Phase 1 stage keeps starting without it.
    "librosa>=0.10",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    # Plain uvicorn, not uvicorn[standard]: the extras pull uvloop (no Windows
    # support) and httptools (lags on new interpreter releases).
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# httpx backs starlette's TestClient, which is how the review API is tested
# without binding a port.
dev = ["pytest>=8.0", "httpx>=0.27"]

# Layer A (§4), installed on the STREAMING PC. Deliberately its own extra: §2.1
# requires capture to run whether or not this application is installed or
# working, and nothing in clipforge/capture/ imports the rest of the package.
capture = [
    "pynput>=1.7",          # §4.3 hotkeys, §4.4 input hook
    "obsws-python>=1.6",    # §4.1's RecordStateChanged anchor
]

# Only needed to GENERATE the speech fixture, never to run the application.
# Phase 2 needs something to transcribe and every other fixture is band-limited
# noise by design. Piper because it is offline and deterministic: the fixture is
# the measuring instrument for the transcript layer, so its audio has to be the
# same on any machine that regenerates it.
fixtures = ["piper-tts>=1.6"]

# §5.7's transcription. Large: ~100 packages and 2-3 GB of wheels (torch,
# torchaudio, transformers), then ~3 GB for large-v3 on first run. Its own extra
# because the review UI, the capture layer and every Phase 1 stage work without
# it, and a fresh clone must not have to download torch to run the tests.
asr = ["whisperx>=3.8"]

# §12's API transport. Its own extra because the paste round trip is the
# default and always available: a fresh clone must not need an SDK to run the
# suite, and nothing in clipforge/llm/ imports this at module scope -- the
# import is inside the method, the same rule librosa follows above.
#
# NOTHING HAS EVER RUN THROUGH IT. There is no key on this machine, so the
# version floor is a GUESS: it is the release the request shape in
# clipforge/llm/sources.py was written against (adaptive thinking,
# output_config, server-side fallbacks). If the first real call 400s, the
# floor and that request are the two things to look at.
llm = ["anthropic>=0.116"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = [
    "config/*.yaml",
    "config/profiles/*.yaml",
    "db/*.sql",
    "db/migrations/*.sql",
    "review/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
